          type: string
          maxLength: 140
          description: Any alpha numeric text up to 140 characters
          example: "test transaction"
        amount:
          type: number
          format: decimal
          description: Amount of the transaction
          example: 5000
        instrid:
          type: string
          maxLength: 40
          description: Instruction id received by RAAST. In case of 1LINK the field will be blank
          example: "TMIC2305111250238764223"
