openapi: 3.0.3
info:
  title: OpenConnect - API
  version: "1.0.0"
  description: >
    OpenAPI specification for PaysysLabs OpenConnect.
  contact:
    name: PaysysLabs Support
    email: support@paysyslabs.com
  license:
    name: Apache 2.0
servers:
  - url: https://sandbox.paysyslabs.com/openconnect
    variables:
      scheme:
        default: https
      host:
        default: sandbox.paysyslabs.com/OpenConnect
      port:
        default: "443"

# servers:
#   - url: http://localhost:3006
#     description: Local development server

tags:
  - name: Non-Financial APIs
    description: Non-financial service endpoints.
  - name: Financial APIs
    description: Financial transaction endpoints.
  - name: Bank Controller
    description: Bank controller non-financial service endpoints.
  - name: RAAST - Person to Merchant
    description: Real-time payment APIs for person-to-merchant transactions using static QR codes.
  - name: RTGS Transactions - Outward Transactions – Bank to RTGS
    description: Real-Time Gross Settlement (RTGS) outbound transaction APIs for single and batch credit transfers.
  - name: RTGS Transactions - Inward Transactions – RTGS to Bank
    description: Real-Time Gross Settlement (RTGS) inbound transaction APIs for receiving credit transfers and status notifications.
  - name: RAAST ID Management
    description: RAAST ID management and customer registration APIs.
paths:
  /api/v1/paysyslabs/bank/titlefetch:
    post:
      tags:
        - Bank Controller
      operationId: bankControllerTitleFetch
      summary: Title Fetch
      description: >
        The service will be exposed by the bank. The purpose of the method is to allow member banks and
        schemes such as RAAST or 1LINK to get customer account info which is known as Title fetch request.

        The title fetch usually comes before payment request where sender wants to verify beneficiary
        account title and account validation to make sure payment will be sent into the beneficiary account.

      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankControllerTitleFetchRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              receiverinfo:
                toAccount: "PK76NBPA12345678900126985"
              paymentinfo:
                amount: 5000
              reserveFields:
                r1: ""
                r2: ""
                r3: ""
                r4: ""
                r5: ""
      responses:
        "200":
          description: Title fetch successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerTitleFetchResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                receiverinfo:
                  account: "03132370605"
                  iban: "PK76NBPA12345678900126985"
                  title: "Waqas Nizam"
                  mobile: "03132370605"
                  identity:
                    - idType: "CNIC"
                      idValue: "1234512345671"
                    - idType: "Passport"
                      idValue: "AX5985632"
                    - idType: "NTN"
                      idValue: "6598532102"
        "400":
          description: Invalid account or account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerTitleFetchErrorResponse"
              example:
                response:
                  responseCode: "01"
                  responseDesc: "Invalid account or no account found"
                info:
                  stan: "010123"
                  rrn: "01012301012"

  /api/v1/paysyslabs/bank/creditposting:
    post:
      tags:
        - Bank Controller
      operationId: bankControllerCreditPosting
      summary: Credit Posting
      description: >
        The method is used to credit bank's customer account whenever payment comes from RAAST.
        The Open connect sent credit request to the bank's system using this method in the request mode.
        In case of rejection Open connect will instantly return payment to sender bank.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankControllerCreditPostingRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              receiverinfo:
                toAccount: "PK76NBPA12345678900126985"
                toAccountTitle: "Waqas Nizam"
              senderinfo:
                senderBankIMD: ""
                senderBankBIC: "NBPPBKKA"
                fromAccount: "PK56ABIN1234567890000001"
                fromAccountTitle: "Muhammad Ali"
                fromAccountCnic: "1234512345671"
              paymentinfo:
                purposeCode: "0110"
                narration: "test transaction"
                amount: 5000
                instrid: "TMIC2305111250238764223"
                endToEndid: "1fc66b584e77-46e6-9dcb-b12c00e7742"
                txid: "TMIC2305111250238764223"
                msgid: "TMICFBPK110523001112502"
              reserveFields:
                r1: ""
                r2: ""
                r3: ""
                r4: ""
                r5: ""
      responses:
        "200":
          description: Credit posting successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditPostingResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
        "400":
          description: Credit limit exceeded for the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditPostingErrorResponse"
              example:
                response:
                  responseCode: "04"
                  responseDesc: "Credit limit exceeded for the account"
                info:
                  stan: "010123"
                  rrn: "01012301012"

  /api/v1/paysyslabs/bank/creditadvise:
    post:
      tags:
        - Bank Controller
      operationId: bankControllerCreditAdvise
      summary: Credit Advise
      description: >
        Advise means where bank is responsible to credit amount into the receiver account. As a guaranteed delivery
        mechanism (SAF), OC will sent credit request as advise to bank's system via SAF mechanism.

        This method will be used in any of below case:
        - 1LINK incoming credit advise
        - RAAST P2P inward return payments, this happens when previously made outward P2P payment failed at receiving bank end and bank initiate return after sometime.
        - RAAST P2P Timeout transactions

      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankControllerCreditAdviseRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
                initiator: "RAAST"
                txnType: "01"
              receiverinfo:
                toAccount: "PK76NBPA12345678900126985"
                toAccountTitle: "Waqas Nizam"
              senderinfo:
                senderBIC: "NBPPBKKA"
                senderIMD: ""
                fromAccount: "PK56ABIN1234567890000001"
                fromAccountTitle: "Muhammad Ali"
                fromAccountCnic: "1234512345671"
              paymentinfo:
                purposeCode: "0125"
                narration: "test transaction"
                amount: 5000
                instrid: "TMIC2305111250238764223"
                endToEndid: "1fc66b584e77-46e6-9dcb-b12c00e7742"
                txid: "TMIC2305111250238764223"
                msgid: "TMICFBPK110523001112502"
                oneLinkrrn: "000223698745"
                oneLinkstan: "987456"
              orgTxnInfo:
                orgtxndate: "20231015"
                orgtxntime: "182243"
                orginstrid: "TMIC2305111250238764223"
                orgendToEndid: "1fc66b584e77-46e6-9dcb-b12c00e7742"
                orgtxid: "TMIC2305111250238764223"
                orgmsgid: "TMICFBPK110523001112502"
              reserveFields:
                r1: ""
                r2: ""
                r3: ""
                r4: ""
                r5: ""
      responses:
        "200":
          description: Credit advise successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditAdviseResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
        "400":
          description: Duplicate transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditAdviseErrorResponse"
              example:
                response:
                  responseCode: "09"
                  responseDesc: "Duplicate transaction"
                info:
                  stan: "010123"
                  rrn: "01012301012"

  /api/v1/paysyslabs/bank/creditinquiry:
    post:
      tags:
        - Bank Controller
      operationId: bankControllerCreditInquiry
      summary: Credit Inquiry
      description: >
        The purpose of this request to inquire the status of the previously posted credit request or advise.

        In case if original transaction got timeout, the Open Connect initiate transaction inquiry to check the
        transaction faith.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankControllerCreditInquiryRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              orgTxnInfo:
                orgrrn: "000223698745"
                orgstan: "987456"
                orgtxndate: "20231015"
                orgtxntime: "182243"
      responses:
        "200":
          description: Credit inquiry successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditInquiryResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                  rrn: "010123"
                  stan: "01012301012"
                orgResponse:
                  orgresponseCode: "00"
                  orgresponseDesc: "Success"
        "400":
          description: No transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerCreditInquiryResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                  rrn: "010123"
                  stan: "01012301012"
                orgResponse:
                  orgresponseCode: "01"
                  orgresponseDesc: "No transaction found"

