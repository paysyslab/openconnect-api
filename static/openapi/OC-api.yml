components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  schemas:
    RAASTPay2OneStepRegistrationRequest:
      type: object
      properties:
        info:
          $ref: "#/components/schemas/RAASTPay2OneStepRegistrationInfo"
        uid:
          $ref: "#/components/schemas/RAASTPay2OneStepRegistrationUid"
        customerInfo:
          $ref: "#/components/schemas/RAASTPay2OneStepRegistrationCustomerInfo"
        aliases:
          type: array
          description: List of aliases and accounts to be registered along with customer during 'One-step customer registration'
          items:
            type: object
        accounts:
          type: array
          description: Customer accounts related with alias
          items:
            $ref: "#/components/schemas/RAASTPay2OneStepRegistrationAccount"
      required:
        - info
        - uid
        - customerInfo
        - accounts

    RAASTPay2OneStepRegistrationInfo:
      type: object
      properties:
        rrn:
          type: string
          minLength: 12
          maxLength: 12
          description: Retrieval reference number - Key Field
          example: "000223698745"
        stan:
          type: string
          minLength: 6
          maxLength: 6
          description: System trace audit number - Key Field for duplicate check combined with RRN and Txn Date
          example: "987456"
        txndate:
          type: string
          minLength: 8
          maxLength: 8
          description: Transaction date (YYYYMMDD)
          example: "20231015"
        txntime:
          type: string
          minLength: 6
          maxLength: 6
          description: Transaction time (HHMMSS)
          example: "182243"
      required:
        - rrn
        - stan
        - txndate
        - txntime

    RAASTPay2OneStepRegistrationUid:
      type: object
      properties:
        type:
          type: string
          maxLength: 20
          description: |
            The following values are applicable:
            For Individuals:
            - CNIC
            - NICOP
            - POC (for non-Pakistan residents)
            For Non-individuals:
            - REG_NO (SCP registration number)
            - NTN (for businesses)
          example: "CNIC"
        value:
          type: string
          maxLength: 20
          description: Customer's document number
          example: "42301463890021"
      required:
        - type
        - value

    RAASTPay2OneStepRegistrationCustomerInfo:
      type: object
      properties:
        documentType:
          type: string
          maxLength: 20
          description: |
            The following values are applicable:
            For Individuals:
            - CNIC
            - NICOP
            - POC (for non-Pakistan residents)
            For Non-individuals:
            - REG_NO (SCP registration number)
            - NTN (for businesses)
          example: "CNIC"
        documentNumber:
          type: string
          maxLength: 20
          description: Customer's document number
          example: "42301463890021"
        name:
          type: string
          maxLength: 140
          description: Customer's name
          example: "Account Title here"
        surname:
          type: string
          maxLength: 80
          description: Customer's surname
          example: ""
        gender:
          type: string
          description: |
            Customer's gender:
            - MALE = male
            - FEMA = female
            - TRNS = transgender
          example: "MALE"
        birthDate:
          type: string
          description: Customer's birth date (yyyy-MM-dd)
          example: "1987-01-28"
        startDate:
          type: string
          description: Start date (yyyy-MM-dd)
          example: "2021-05-15"
        expirationDate:
          type: string
          description: Expiration date (yyyy-MM-dd)
          example: "2025-05-15"
      required:
        - documentType
        - documentNumber
        - name
        - gender
        - birthDate
        - startDate
        - expirationDate

    RAASTPay2OneStepRegistrationAccount:
      type: object
      properties:
        id:
          type: object
          properties:
            iban:
              type: string
              description: International Bank Account Number
              example: "PK79NBPA00200041373439"
        currency:
          type: string
          maxLength: 3
          description: Currency code (PKR)
          example: "PKR"
        isDefault:
          type: boolean
          description: Flag indicating if this is the default account
          example: true
      required:
        - id
        - currency
        - isDefault

    RAASTPay2OneStepRegistrationResponse:
      type: object
      properties:
        response:
          $ref: "#/components/schemas/RAASTPay2OneStepRegistrationResponseInfo"
        info:
          $ref: "#/components/schemas/RAASTPay2OneStepRegistrationResponseData"
      required:
        - response
        - info

