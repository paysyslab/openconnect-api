    post:
      tags:
        - Financial APIs
      operationId: billPaymentTelcoBundle
      summary: Bill Payment - Telco Bundle / Package Purchase
      description: >
        This service transmits telco bundle/package purchase payment requests.
        The Open Connect facilitates integration with telecommunications companies (telcos) for bundle and package purchases.
        Before confirming a bundle purchase as paid, the bank's core holds the responsibility of debiting the customer's account
        and conducting a thorough set of validations. These validations encompass critical aspects such as limit verification
        and checking the status of the account. This meticulous approach guarantees that the bundle purchase process is executed
        securely, in full compliance with the bank's strict operational criteria and standards.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPayment2Request"
            examples:
