          type: number
          format: decimal
          description: Amount of the transaction
          example: 5000
        instrid:
          type: string
          maxLength: 40
          description: Instruction id received by RAAST. In case of 1LINK the field will be blank
          example: "TMIC2305111250238764223"
        endToEndid:
          type: string
          maxLength: 40
          description: End to end id received by RAAST. In case of 1LINK the field will be blank
          example: "1fc66b584e77-46e6-9dcb-b12c00e7742"
        txid:
          type: string
          maxLength: 40
