          example: "TMIC2305111250238764223"
        msgid:
          type: string
          minLength: 5
          maxLength: 35
          description: Message id received by RAAST. In case of 1LINK the field will be blank
          example: "TMICFBPK110523001112502"
        oneLinkrrn:
          type: string
          maxLength: 12
          description: Retrieval reference number. In case of 1LINK, OC will send same value which comes from 1LINK in DE-37. In case of RAAST the field will be blank
          example: "000223698745"
        oneLinkstan:
          type: string
          maxLength: 6
          description: System trace audit number. In case of 1LINK, OC will send same value which comes from 1LINK in DE-11. In case of RAAST the field will be blank
