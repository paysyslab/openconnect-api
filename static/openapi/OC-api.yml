  /api/v1/paysyslabs/channel/notifyRequestForReturnPayment:
    post:
      tags:
        - Bank Controller
      operationId: bankControllerNotifyRequestForReturnPayment
      summary: Channel Notify Request for Return Payment
      description: >
        Request to generate notify request for return payment.

        Bank will expose a new end point which OC will call once it will receive the accept or reject reply from SBP.

        OC will initiate notifyRequestForReturnPayment to channel
        OC will send access token in headers of this API. (Access token received in response of authentication)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankControllerNotifyRequestForReturnPayment"
            example:
              info:
                rrn: "000236987456"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              originalMessageInfo:
                originalRrn: "010123010123"
                originalStan: "010123"
                camt056MessageId: "070341490000999999"
              statusInfo:
                status: "RJCT"
                rjctCode: ""
                rjctDesc: ""
              reserveFields:
                r1: ""
                r2: ""
                r3: ""
                r4: ""
                r5: ""
      responses:
        "200":
          description: Notify request for return payment successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankControllerNotifyRequestForReturnPaymentResponse"
              example:
                response:
                  responseCode: "00"
                  responseDesc: "Success"
                  stan: "010123"
                  rrn: "010123010123"

  /api/v1/paysyslabs/customers/one-step:
    post:
      tags:
        - RAAST ID Management
      operationId: oneStepRegistration
      summary: One Step Registration
      description: >
        Request to register a new own customer in CAS. SBP has introduced an instant payment system for person-to-person transfer. 
        The system will facilitate account holders to send or receive using RAAST ID. RAAST ID means anything which is easy to remember. 
        SBP is allowing account holders to tag their account with any of their below personal information which they can share with other account holders to send funds into his/her account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RAASTPay2OneStepRegistrationRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              uid:
                type: "CNIC"
                value: "42301463890021"
              customerInfo:
                documentType: "CNIC"
                documentNumber: "42301463890021"
                name: "Account Title here"
                surname: ""
                gender: "MALE"
                birthDate: "1987-01-28"
                startDate: "2021-05-15"
                expirationDate: "2025-05-15"
              aliases:
                []
              accounts:
                - id:
                    iban: "PK79NBPA00200041373439"
                  currency: "PKR"
                  isDefault: true
      responses:
        "200":
          description: One step registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2OneStepRegistrationResponse"
              example:
                response:
                  responseCode: "0000"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"
        "400":
          description: Customer already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2OneStepRegistrationResponse"
              example:
                response:
                  responseCode: "0306"
                  responseDesc: "Customer already exists"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"

  /api/v1/paysyslabs/customers/registercaa:
    post:
      tags:
        - RAAST ID Management
      operationId: registerCAA
      summary: Register CAA
      description: >
        Request to register an existing RAAST customer as a new own customer in CAS. As per SBP RAAST ID Linking / delinking guidelines, 
        OC have exposed a custom method in which OC will do following calls sequentially to link customer account with RAAST ID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RAASTPay2RegisterCAARequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              uid:
                type: "CNIC"
                value: "42301463890021"
              customerInfo:
                documentType: "CNIC"
                documentNumber: "42301463890021"
                name: "ANIL"
                surname: "KUMAR"
                gender: "MALE"
                birthDate: "1987-01-28"
                startDate: "2021-05-15"
                expirationDate: "2025-05-15"
              aliases:
                - type: "MOBILE"
                  value: "03222507423"
                  status: "active"
                  accounts:
                    - id:
                        iban: "PK79NBPA00200041373439"
                      currency: "PKR"
                      isDefault: true
              accounts:
                - id:
                    iban: "PK79NBPA00200041373439"
                  currency: "PKR"
                  isDefault: true
      responses:
        "200":
          description: Register CAA successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2RegisterCAAResponse"
              example:
                response:
                  responseCode: "0000"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"
        "400":
          description: Customer already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2RegisterCAAResponse"
              example:
                response:
                  responseCode: "0306"
                  responseDesc: "Customer already exists"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"

  /api/v1/paysyslabs/account/delinkaccountalis:
    post:
      tags:
        - RAAST ID Management
      operationId: unlinkAccountToAlias
      summary: Unlink Account to Alias
      description: >
        Customer has registered RAAST ID previously with on RAAST. In this scenario customer want to unlink his/her 
        selected account and assumption is customer is already linked the account with RAAST ID. The reason for performing 
        this operation may be any of the following:
        - Customer want to link his/her another account with the current institution
        - Customer want to link his/her another account with the other RAAST participants
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RAASTPay2UnlinkAccountToAliasRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              uid:
                type: "CNIC"
                value: "42301463890999"
              alias:
                type: "MOBILE"
                value: "03222507444"
              account:
                iban: "PK79NBPA00200041373439"
                isDefault: true
      responses:
        "200":
          description: Unlink account to alias successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2UnlinkAccountToAliasResponse"
              example:
                response:
                  responseCode: "0000"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"
        "400":
          description: Cannot find customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2UnlinkAccountToAliasResponse"
              example:
                response:
                  responseCode: "0305"
                  responseDesc: "Cannot find customer"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"

  /api/v1/paysyslabs/account/linkaccountalis:
    post:
      tags:
        - RAAST ID Management
      operationId: linkAccountToAlias
      summary: Link Account to Alias
      description: >
        Customer has registered RAAST ID previously with bank or any another financial institution on RAAST. In this scenario 
        customer want to relink his/her selected account and assumption is customer is already unlinked the account with RAAST ID 
        and do not have any linked account id with RAAST ID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RAASTPay2LinkAccountToAliasRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              uid:
                type: "CNIC"
                value: "42301463890999"
              alias:
                type: "MOBILE"
                value: "03222507444"
              account:
                iban: "PK79NBPA00200041373439"
                isDefault: true
                currency: "PKR"
      responses:
        "200":
          description: Link account to alias successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2LinkAccountToAliasResponse"
              example:
                response:
                  responseCode: "0000"
                  responseDesc: "Success"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"
        "400":
          description: Cannot find customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RAASTPay2LinkAccountToAliasResponse"
              example:
                response:
                  responseCode: "0305"
                  responseDesc: "Cannot find customer"
                info:
                  stan: "010123"
                  rrn: "01012301012"
                  correlationId: "7ad7fb9f-99dc-4c2c-ab88-abddb87789a0"

  /api/v1/paysyslabs/account/setdefault:
    post:
      tags:
        - RAAST ID Management
      operationId: setDefaultAccount
      summary: Set Default Account
      description: >
        The purpose of this API is to facilitate users who have multiple accounts within their organization. 
        These users have already registered multiple accounts and now wish to change the default account associated with 
        a specific RAAST ID. To achieve this, users are not required to go through the linking or delinking process. 
        They will be provided with a list of linked accounts and can effortlessly designate any of these linked accounts as their new default account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RAASTPay2SetDefaultAccountRequest"
            example:
              info:
                rrn: "000223698745"
                stan: "987456"
                txndate: "20231015"
                txntime: "182243"
              uid:
                type: "CNIC"
